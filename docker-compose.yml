version: '3'

services:
  mongo_db:
    container_name: db_container
    image: mongo:latest
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongo_db:/data/db

  server:
    build: ./server
    volumes:
      - ./server:/usr/src/app
    ports:
      - 4000:3000
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo_db:27017  #also can use container name: mongodb://db_container:27017
      DB_NAME: Issue
      NAME: BONNY
    depends_on:
      - mongo_db

volumes:
  mongo_db: {}